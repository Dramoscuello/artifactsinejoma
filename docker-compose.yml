version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inejoma_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: artifacts_inejoma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artifacts_inejoma"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inejoma_backend
    restart: always
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres_password@postgres:5432/artifacts_inejoma
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inejoma.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      ADMIN_NAME: ${ADMIN_NAME:-Profesor Administrador}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inejoma_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
